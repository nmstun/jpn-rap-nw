<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- SafariはSVGのrel=iconを使わないため、ico/PNGも併せて置く。SVGだけだとタブが
         空になる。?v= はブラウザのファビコンキャッシュ対策で、ファビコンは通常のHTTP
         キャッシュ制御を無視して保持されるため、絵柄を変えたらこの番号も上げてURLを変える -->
    <link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon-32.png?v=3" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jpn-rap-nw</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
